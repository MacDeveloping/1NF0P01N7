<html class="rootHTML">
<div id="container-days">
    <div id="day-today" class="daybox">

        <!-- Linker Bereich: Wochentag und Datum -->
        <div id="day-info" class="day-info">
            <p id="weekday" class="weekday">Donnerstag</p>
            <p id="date" class="date">15.09.</p>
        </div>

        <!-- Rechter Bereich: Uhrzeit und Termine -->
        <div id="container-time-events" class="container-time-events">

            <div id="time-event" class="time-event">

                <p id="time" class="time">14:30 Uhr</p>

                <div id="container-events" class="container-events">
                    <div id="event" class="event">
                        <p id="title" class="title">Das ist der Titel</p>
                        <p id="description" class="description">Und hier stehen noch mehr Infos.</p>
                    </div>
                </div>


            </div>

        </div>

    </div>
</div>
</html>



<button id="cloneBtn">Klon erstellen jetzt</button>
<button id="cloneUhrzeit">+ Uhrzeit</button>
<button id="cloneEvent">+ Event</button>



<style>

    :root {
        /*Farben*/
        --backround-color: #806b5b;
        --primary-text-color: black;
        /*Schrift*/
        --primary-textgroeße: 25px;
        --textgroeße-datum: 0.8rem;
        --textgroeße-beschreibung: 0.7rem;
        --textart-default-text: Poppins, Calibri, Arial;
        --textart-default-title: 'Black Mango', Calibri, Arial;
        /*Abstaende und Groeßen*/
        --daybox-ecke-radius: 25px;
        --daybox-padding: 20px;
        --abstand-naechste-daybox: 20px;
        --breite-wochentag: 180px;
        --breite-uhrzeit: 130px;
        --abstand-tag-zu-wochentag: -0.4rem;
        --abstand-beschreibung-zu-titel: -0.4rem;
    }

    .rootHTML {
        background-color: black;
        font-size: var(--primary-textgroeße);
    }

    .daybox {
        /*Box Layout*/
        background-color: var(--backround-color);
        /*Schriftart*/
        text-align: left;
        font-family: var(--textart-default-text);
        color: var(--primary-text-color);
        /*Abstaende innerhalb*/
        /*Einzeln festlegen:
        padding-top: 20px;
        padding-left: 20px;
        padding-bottom: 20px;
        padding-right: 20px;
        */
        padding: var(--daybox-padding);
        border-radius: var(--daybox-ecke-radius);
        /*Abstand unten zur naechsten Box*/
        margin-bottom: var(--abstand-naechste-daybox);
        /*Anordnung der Elemente innerhalb*/
        display: flex;
        flex-direction: row;
        flex-wrap: nowrap;
        align-items: flex-start;
    }

    /* Container: Links Uhrzeit, Rechts Events */
    .day-info {
        display: flex;
        flex-direction: column;
        flex-wrap: nowrap;
        width: var(--breite-wochentag);
        flex-shrink: 0;
    }

    .weekday {
        margin-top: 0px;
        margin-bottom: 0px;
    }

    .date {
        margin-top: var(--abstand-tag-zu-wochentag);
        margin-bottom: 0px;
        font-size: var(--textgroeße-datum);
    }

    /* Container: Links Uhrzeit, Rechts Events */
    .time-event {
        display: flex;
        flex-direction: row;
        flex-wrap: nowrap;
        align-items: flex-start;
    }

    .time {
        margin-top: 0px;
        margin-bottom: 0px;
        width: var(--breite-uhrzeit);
        flex-shrink: 0;
    }

    /* Container mit Titel und Beschreibung */
    .event {
        display: flex;
        flex-direction: column;
        flex-wrap: nowrap;
        align-items: flex-start;
    }

    .title {
        margin-top: 0px;
        margin-bottom: 0px;
    }


    .description {
        margin: 0px;
        margin-top: var(--abstand-tag-zu-wochentag);
        margin-bottom: 0px;
        font-size: var(--textgroeße-beschreibung);
    }
</style>



<script>
    document.addEventListener("DOMContentLoaded", function () {
        
        // Counter zur identifizierung
        //soll spaeter durch die JSON daten eingabe mit dem datum ersetzt werden
        let cloneCounter = 0;

        const original = document.getElementById("day-today");
        const container = document.getElementById("container-days");
        const cloneBtn = document.getElementById("cloneBtn");

        //Tagbox klonen
        cloneBtn.addEventListener("click", () => {
            // true = mit allen Kind-Elementen klonen
            const clone = original.cloneNode(true);

            cloneCounter++;

            // Optional: ID aendern, um doppelte IDs zu vermeiden
            clone.id = "clone-" + cloneCounter;

            //Texte des Elements anpassen
            const descr = clone.querySelector(".container-time-events .time-event .container-events .event .description");
            
            descr.textContent = "ID: " + clone.id;


            container.appendChild(clone);
        });


        const originalUhrzeit = document.getElementById("time-event");
        const containerZeiten = document.getElementById("container-time-events");
        const cloneUhrzeit = document.getElementById("cloneUhrzeit");

        //Uhrzeit klonen
        cloneUhrzeit.addEventListener("click", () => {
            // true = mit allen Kind-Elementen klonen
            const clone = originalUhrzeit.cloneNode(true);

            containerZeiten.appendChild(clone);
        });


        const originalEvent = document.getElementById("event");
        const containerEvents = document.getElementById("container-events");
        const cloneEvent = document.getElementById("cloneEvent");

        //Event klonen
        cloneEvent.addEventListener("click", () => {
            // true = mit allen Kind-Elementen klonen
            const clone = originalEvent.cloneNode(true);

            containerEvents.appendChild(clone);
        });
    });
</script>

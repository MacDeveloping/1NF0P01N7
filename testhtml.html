<html lang="de">
<head>
<meta charset="UTF-8">
<title>DIV klonen</title>
<style>
    .box {
        width: 150px;
        height: 100px;
        background-color: lightblue;
        border: 2px solid #333;
        margin: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background-color 0.3s;
    }
    .box:hover {
        background-color: deepskyblue;
    }
</style>
</head>
<body>

<div id="container">
    <div id="original" class="box">Original</div>
</div>

<button id="cloneBtn">Klon erstellen</button>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const original = document.getElementById("original");
    const container = document.getElementById("container");
    const cloneBtn = document.getElementById("cloneBtn");

    // Klick-Event für Original
    original.addEventListener("click", () => {
        alert("Original-Box geklickt!");
    });

    cloneBtn.addEventListener("click", () => {
        // true = mit allen Kind-Elementen klonen
        const clone = original.cloneNode(true);

        // Optional: ID ändern, um doppelte IDs zu vermeiden
        clone.id = "clone-" + Date.now();

        // Event-Listener neu hinzufügen (wird NICHT automatisch kopiert)
        clone.addEventListener("click", () => {
            alert("Klon-Box geklickt!");
        });

        container.appendChild(clone);
    });
});
</script>

</body>
</html>

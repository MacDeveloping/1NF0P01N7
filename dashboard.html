<body>

    <div class="app">

        <!-- =========================
             LINKES MENÜ
             ========================= -->

        <aside class="sidebar">

            <h1>Wochenübersicht</h1>

            <div class="sidebar-section">
                <div class="sidebar-section-title">
                    JSON
                </div>

                <button class="primary"
                        onclick="loadFromUrl()">
                    ↻ Von URL laden
                </button>

                <button onclick="document.getElementById('fileInput').click()">
                    📂 Lokale JSON laden
                </button>

                <button class="success"
                        onclick="downloadJson()">
                    💾 JSON speichern
                </button>

                <input id="fileInput"
                       type="file"
                       accept=".json,application/json"
                       style="display:none"
                       onchange="loadLocalFile(event)">
            </div>

            <div class="sidebar-section">
                <div class="sidebar-section-title">
                    Ansicht
                </div>

                <button onclick="toggleRawJson()">
                    { } JSON-Vorschau
                </button>
            </div>

            <div class="sidebar-footer">
                Änderungen werden direkt in der aktuellen JSON-Struktur
                gespeichert.
            </div>

        </aside>


        <!-- =========================
             HAUPTBEREICH
             ========================= -->

        <main class="content">

            <div class="content-header">

                <h2>JSON bearbeiten</h2>

                <div id="status"
                     class="status">
                    Lade JSON …
                </div>

            </div>

            <div id="editor"
                 class="days-container">
            </div>

            <div id="rawJsonContainer"
                 class="raw-json"
                 style="display:none;">

                <div class="raw-json-header">

                    <strong>Aktuelle JSON</strong>

                    <button class="btn btn-add"
                            onclick="copyJson()">
                        JSON kopieren
                    </button>

                </div>

                <pre id="jsonPreview"></pre>

            </div>

        </main>

    </div>


    <script>
        /*
         * ==========================================================
         * KONFIGURATION
         * ==========================================================
         */

        const JSON_URL =
            "https://macdeveloping.github.io/1NF0P01N7/wochenuebersicht.json";


        /*
         * ==========================================================
         * AKTUELLE DATEN
         * ==========================================================
         */

        let data = {
            days: []
        };


        /*
         * ==========================================================
         * INITIALISIERUNG
         * ==========================================================
         */

        document.addEventListener("DOMContentLoaded", () => {
            loadFromUrl();
        });


        /*
         * ==========================================================
         * JSON VON URL LADEN
         * ==========================================================
         */

        async function loadFromUrl() {

            setStatus("Lade JSON …");

            try {

                const response = await fetch(JSON_URL, {
                    cache: "no-cache"
                });

                if (!response.ok) {
                    throw new Error(
                        `HTTP-Fehler ${response.status}`
                    );
                }

                const json = await response.json();

                validateJson(json);

                data = json;

                render();

                setStatus("JSON erfolgreich geladen", "success");

            } catch (error) {

                console.error(error);

                setStatus(
                    "Fehler beim Laden der JSON",
                    "error"
                );

                alert(
                    "Die JSON konnte nicht geladen werden.\n\n" +
                    error.message +
                    "\n\n" +
                    "Mögliche Ursache: Die HTML-Datei wird lokal geöffnet " +
                    "und der Browser blockiert den Zugriff auf die URL " +
                    "(CORS). In diesem Fall kann die JSON über " +
                    "\"Lokale JSON laden\" geöffnet werden."
                );
            }
        }


        /*
         * ==========================================================
         * LOKALE JSON LADEN
         * ==========================================================
         */

        function loadLocalFile(event) {

            const file =
                event.target.files[0];

            if (!file) {
                return;
            }

            const reader =
                new FileReader();

            reader.onload = function (e) {

                try {

                    const json =
                        JSON.parse(e.target.result);

                    validateJson(json);

                    data = json;

                    render();

                    setStatus(
                        "Lokale JSON geladen",
                        "success"
                    );

                } catch (error) {

                    console.error(error);

                    setStatus(
                        "Ungültige JSON",
                        "error"
                    );

                    alert(
                        "Die ausgewählte Datei ist keine gültige " +
                        "Wochenübersicht-JSON.\n\n" +
                        error.message
                    );
                }

            };

            reader.onerror = function () {

                setStatus(
                    "Datei konnte nicht gelesen werden",
                    "error"
                );

                alert(
                    "Die Datei konnte nicht gelesen werden."
                );
            };

            reader.readAsText(file);

            // Ermöglicht das erneute Auswählen derselben Datei.
            event.target.value = "";
        }


        /*
         * ==========================================================
         * JSON VALIDIEREN
         * ==========================================================
         */

        function validateJson(json) {

            if (
                typeof json !== "object" ||
                json === null
            ) {
                throw new Error(
                    "Die JSON muss ein Objekt sein."
                );
            }

            if (!Array.isArray(json.days)) {
                throw new Error(
                    'Das Feld "days" muss ein Array sein.'
                );
            }

            // Fehlende Arrays ergänzen.
            json.days.forEach(day => {

                if (!Array.isArray(day.times)) {
                    day.times = [];
                }

                day.times.forEach(time => {

                    if (!Array.isArray(time.events)) {
                        time.events = [];
                    }

                });

            });
        }


        /*
         * ==========================================================
         * HAUPT-RENDER-FUNKTION
         * ==========================================================
         */

        function render() {

            const editor =
                document.getElementById("editor");

            editor.innerHTML = "";

            if (!data.days || data.days.length === 0) {

                editor.innerHTML = `
                    <div class="empty">
                        Noch keine Tage vorhanden.
                    </div>
                `;

            } else {

                data.days.forEach(
                    (day, dayIndex) => {

                        editor.appendChild(
                            createDayElement(
                                day,
                                dayIndex
                            )
                        );

                    }
                );
            }

            // Globalen "Tag hinzufügen"-Button erzeugen.
            const addDayButton =
                document.createElement("button");

            addDayButton.className =
                "btn-add-large";

            addDayButton.textContent =
                "+ Tag hinzufügen";

            addDayButton.onclick =
                () => addDay();

            editor.appendChild(addDayButton);

            updateRawJson();
        }


        /*
         * ==========================================================
         * DAY ELEMENT
         * ==========================================================
         */

        function createDayElement(day, dayIndex) {

            const container =
                document.createElement("section");

            container.className =
                "day";

            container.innerHTML = `
                <div class="day-header">

                    <h3>Tag ${dayIndex + 1}</h3>

                    <button
                        class="btn btn-delete"
                        title="Diesen Tag löschen">
                        Löschen
                    </button>

                </div>

                <div class="fields-row">

                    <div class="field">

                        <label>
                            date
                        </label>

                        <input
                            type="text"
                            value="${escapeAttribute(day.date ?? "")}"
                            placeholder="z.B. 21.09.2026">

                    </div>

                </div>

                <div class="times"></div>

                <button class="btn-add-large">
                    + Zeit hinzufügen
                </button>
            `;

            /*
             * Datum
             */

            const dateInput =
                container.querySelector("input");

            dateInput.addEventListener(
                "input",
                () => {

                    data.days[dayIndex].date =
                        dateInput.value;

                    updateRawJson();
                }
            );


            /*
             * Tag löschen
             */

            container
                .querySelector(".btn-delete")
                .addEventListener(
                    "click",
                    () => deleteDay(dayIndex)
                );


            /*
             * Zeiten
             */

            const timesContainer =
                container.querySelector(".times");

            if (day.times.length === 0) {

                timesContainer.innerHTML = `
                    <div class="empty">
                        Keine Zeiten vorhanden.
                    </div>
                `;

            } else {

                day.times.forEach(
                    (time, timeIndex) => {

                        timesContainer.appendChild(
                            createTimeElement(
                                time,
                                dayIndex,
                                timeIndex
                            )
                        );

                    }
                );
            }


            /*
             * Zeit hinzufügen
             */

            container
                .querySelector(".btn-add-large")
                .addEventListener(
                    "click",
                    () => addTime(dayIndex)
                );


            return container;
        }


        /*
         * ==========================================================
         * TIME ELEMENT
         * ==========================================================
         */

        function createTimeElement(
            time,
            dayIndex,
            timeIndex
        ) {

            const container =
                document.createElement("div");

            container.className =
                "time";

            container.innerHTML = `
                <div class="time-header">

                    <h4>
                        Zeit ${timeIndex + 1}
                    </h4>

                    <button
                        class="btn btn-delete">
                        Löschen
                    </button>

                </div>

                <div class="fields-row">

                    <div class="field">

                        <label>
                            time
                        </label>

                        <input
                            type="text"
                            value="${escapeAttribute(time.time ?? "")}"
                            placeholder="z.B. 19:45">

                    </div>

                </div>

                <div class="events"></div>

                <button class="btn-add-large">
                    + Event hinzufügen
                </button>
            `;


            /*
             * Zeit bearbeiten
             */

            const timeInput =
                container.querySelector("input");

            timeInput.addEventListener(
                "input",
                () => {

                    data.days[dayIndex]
                        .times[timeIndex]
                        .time =
                        timeInput.value;

                    updateRawJson();
                }
            );


            /*
             * Zeit löschen
             */

            container
                .querySelector(".btn-delete")
                .addEventListener(
                    "click",
                    () => deleteTime(
                        dayIndex,
                        timeIndex
                    )
                );


            /*
             * Events
             */

            const eventsContainer =
                container.querySelector(".events");

            if (
                !time.events ||
                time.events.length === 0
            ) {

                eventsContainer.innerHTML = `
                    <div class="empty">
                        Keine Events vorhanden.
                    </div>
                `;

            } else {

                time.events.forEach(
                    (event, eventIndex) => {

                        eventsContainer.appendChild(
                            createEventElement(
                                event,
                                dayIndex,
                                timeIndex,
                                eventIndex
                            )
                        );

                    }
                );
            }


            /*
             * Event hinzufügen
             */

            container
                .querySelector(".btn-add-large")
                .addEventListener(
                    "click",
                    () => addEvent(
                        dayIndex,
                        timeIndex
                    )
                );


            return container;
        }


        /*
         * ==========================================================
         * EVENT ELEMENT
         * ==========================================================
         */

        function createEventElement(
            event,
            dayIndex,
            timeIndex,
            eventIndex
        ) {

            const container =
                document.createElement("div");

            container.className =
                "event";

            container.innerHTML = `
                <div class="event-header">

                    <span class="event-number">
                        Event ${eventIndex + 1}
                    </span>

                    <button
                        class="btn btn-delete">
                        Löschen
                    </button>

                </div>

                <div class="fields-row">

                    <div class="field">

                        <label>
                            title
                        </label>

                        <input
                            type="text"
                            value="${escapeAttribute(event.title ?? "")}"
                            placeholder="Titel">

                    </div>

                </div>

                <div
                    class="field"
                    style="margin-top:10px;">

                    <label>
                        notes
                    </label>

                    <textarea
                        placeholder="Notizen">${escapeHtml(event.notes ?? "")}</textarea>

                </div>
            `;


            /*
             * Titel
             */

            const titleInput =
                container.querySelector("input");

            titleInput.addEventListener(
                "input",
                () => {

                    data.days[dayIndex]
                        .times[timeIndex]
                        .events[eventIndex]
                        .title =
                        titleInput.value;

                    updateRawJson();
                }
            );


            /*
             * Notes
             */

            const notesInput =
                container.querySelector("textarea");

            notesInput.addEventListener(
                "input",
                () => {

                    data.days[dayIndex]
                        .times[timeIndex]
                        .events[eventIndex]
                        .notes =
                        notesInput.value;

                    updateRawJson();
                }
            );


            /*
             * Event löschen
             */

            container
                .querySelector(".btn-delete")
                .addEventListener(
                    "click",
                    () => deleteEvent(
                        dayIndex,
                        timeIndex,
                        eventIndex
                    )
                );


            return container;
        }


        /*
         * ==========================================================
         * TAG HINZUFÜGEN
         * ==========================================================
         */

        function addDay() {

            data.days.push({
                date: "",
                times: []
            });

            render();

            setStatus(
                "Tag hinzugefügt",
                "success"
            );
        }


        /*
         * ==========================================================
         * ZEIT HINZUFÜGEN
         * ==========================================================
         */

        function addTime(dayIndex) {

            data.days[dayIndex]
                .times
                .push({
                    time: "",
                    events: []
                });

            render();

            setStatus(
                "Zeit hinzugefügt",
                "success"
            );
        }


        /*
         * ==========================================================
         * EVENT HINZUFÜGEN
         * ==========================================================
         */

        function addEvent(
            dayIndex,
            timeIndex
        ) {

            data.days[dayIndex]
                .times[timeIndex]
                .events
                .push({
                    title: "",
                    notes: ""
                });

            render();

            setStatus(
                "Event hinzugefügt",
                "success"
            );
        }


        /*
         * ==========================================================
         * TAG LÖSCHEN
         * ==========================================================
         */

        function deleteDay(dayIndex) {

            const day =
                data.days[dayIndex];

            const confirmed =
                confirm(
                    `Tag "${day.date || "ohne Datum"}" wirklich löschen?`
                );

            if (!confirmed) {
                return;
            }

            data.days.splice(
                dayIndex,
                1
            );

            render();

            setStatus(
                "Tag gelöscht",
                "success"
            );
        }


        /*
         * ==========================================================
         * ZEIT LÖSCHEN
         * ==========================================================
         */

        function deleteTime(
            dayIndex,
            timeIndex
        ) {

            const time =
                data.days[dayIndex]
                    .times[timeIndex];

            const confirmed =
                confirm(
                    `Zeit "${time.time || "ohne Uhrzeit"}" wirklich löschen?`
                );

            if (!confirmed) {
                return;
            }

            data.days[dayIndex]
                .times
                .splice(
                    timeIndex,
                    1
                );

            render();

            setStatus(
                "Zeit gelöscht",
                "success"
            );
        }


        /*
         * ==========================================================
         * EVENT LÖSCHEN
         * ==========================================================
         */

        function deleteEvent(
            dayIndex,
            timeIndex,
            eventIndex
        ) {

            const event =
                data.days[dayIndex]
                    .times[timeIndex]
                    .events[eventIndex];

            const confirmed =
                confirm(
                    `Event "${event.title || "ohne Titel"}" wirklich löschen?`
                );

            if (!confirmed) {
                return;
            }

            data.days[dayIndex]
                .times[timeIndex]
                .events
                .splice(
                    eventIndex,
                    1
                );

            render();

            setStatus(
                "Event gelöscht",
                "success"
            );
        }


        /*
         * ==========================================================
         * JSON LOKAL SPEICHERN
         * ==========================================================
         */

        function downloadJson() {

            const json =
                JSON.stringify(
                    data,
                    null,
                    2
                );

            const blob =
                new Blob(
                    [json],
                    {
                        type: "application/json"
                    }
                );

            const url =
                URL.createObjectURL(blob);

            const link =
                document.createElement("a");

            link.href = url;

            link.download =
                "wochenuebersicht.json";

            document.body.appendChild(link);

            link.click();

            document.body.removeChild(link);

            URL.revokeObjectURL(url);

            setStatus(
                "JSON gespeichert",
                "success"
            );
        }


        /*
         * ==========================================================
         * JSON KOPIEREN
         * ==========================================================
         */

        async function copyJson() {

            const json =
                JSON.stringify(
                    data,
                    null,
                    2
                );

            try {

                await navigator.clipboard.writeText(
                    json
                );

                setStatus(
                    "JSON kopiert",
                    "success"
                );

            } catch (error) {

                alert(
                    "Die JSON konnte nicht automatisch kopiert werden."
                );
            }
        }


        /*
         * ==========================================================
         * RAW JSON AKTUALISIEREN
         * ==========================================================
         */

        function updateRawJson() {

            const preview =
                document.getElementById(
                    "jsonPreview"
                );

            if (!preview) {
                return;
            }

            preview.textContent =
                JSON.stringify(
                    data,
                    null,
                    2
                );
        }


        /*
         * ==========================================================
         * RAW JSON EIN-/AUSBLENDEN
         * ==========================================================
         */

        function toggleRawJson() {

            const container =
                document.getElementById(
                    "rawJsonContainer"
                );

            if (
                container.style.display === "none"
            ) {

                container.style.display =
                    "block";

                updateRawJson();

            } else {

                container.style.display =
                    "none";
            }
        }


        /*
         * ==========================================================
         * STATUS
         * ==========================================================
         */

        function setStatus(
            message,
            type = ""
        ) {

            const status =
                document.getElementById(
                    "status"
                );

            status.textContent =
                message;

            status.className =
                "status";

            if (type) {
                status.classList.add(type);
            }
        }


        /*
         * ==========================================================
         * HTML ESCAPING
         * ==========================================================
         */

        function escapeHtml(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        function escapeAttribute(value) {

            return escapeHtml(value);
        }

    </script>
